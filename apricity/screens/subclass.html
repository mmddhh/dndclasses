<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
  <meta name="aui-mouse-events" content="intercept">
  <title>Subclass</title>
  <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
  <link rel="stylesheet" href="choice.css">
</head>
<body class="choice-page">
  <div class="nebula"></div>
  <div class="stars"></div>
  <div class="scan"></div>
  <div class="choice-shell subclass-shell">
    <h1 class="choice-title"><translation>screen.dndclasses.subclass.title</translation></h1>
    <p class="choice-sub"><translation>screen.dndclasses.subclass.hint</translation></p>

    <div class="subclass-columns">
      <div id="subclass-list" class="subclass-list"></div>
      <div id="subclass-detail" class="subclass-detail">
        <div class="empty-state"><translation>screen.dndclasses.subclass.select</translation></div>
      </div>
    </div>

    <div class="subclass-footer">
      <button id="subclass-confirm" type="button" class="choice-confirm" disabled="disabled">
        <translation>screen.dndclasses.subclass.confirm</translation>
      </button>
    </div>
  </div>
  <input id="choice-data" type="hidden" value="">
  <input id="choice-payload" type="hidden" value="">
  <script src="class_features.js"></script>
  <script src="subclass.js"></script>
</body>
</html>
