<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
  <meta name="aui-mouse-events" content="intercept">
  <title>冒险者名册 · 职业创建</title>
  <link rel="stylesheet" href="/apricityui/theme/ore/ore.css">
  <link rel="stylesheet" href="class_creation.css">
</head>
<body class="ore-theme grimoire">
  <div class="grimoire-shell">

    <header class="grimoire-header">
      <div class="emblem">卷</div>
      <div class="grimoire-headings">
        <h1 class="grimoire-title">冒险者名册</h1>
        <p class="grimoire-sub">THE ADVENTURER'S TOME · 职业创建</p>
      </div>
      <div class="grimoire-badge">DND 5E · 27 点购点</div>
    </header>

    <main class="grimoire-main">

      <section id="col-left" class="card tome tome-left">
        <div class="card-header">职业名册</div>
        <div class="card-body tome-body tome-body-fixed">
          <div id="class-list" class="class-list"></div>
        </div>
      </section>

      <section id="col-mid" class="card tome tome-mid">
        <div class="card-header" id="detail-header">职业详情</div>
        <div class="card-body tome-body tome-body-scroll" id="detail-body"></div>
      </section>

      <section id="col-right" class="card tome tome-right">
        <div class="card-header">属性点分配</div>
        <div class="card-body tome-body tome-body-scroll" id="ability-body"></div>
        <div class="card-footer">
          <button id="btn-confirm" class="button confirm-button" type="button" disabled>确认创建角色</button>
          <div id="confirm-msg" class="confirm-msg"></div>
        </div>
      </section>

      <section id="sheet-view" class="card tome sheet-view hidden">
        <div class="card-header" id="sheet-header">角色信息</div>
        <div class="card-body tome-body tome-body-scroll" id="character-sheet-body"></div>
      </section>

      <div id="page-loading" class="page-loading hidden">载入中…</div>

    </main>

    <footer id="grimoire-footer" class="grimoire-footer">
      <div id="footer-summary" class="footer-summary">尚未选择职业。</div>
      <div class="rune-row">
        <span class="rune">8 → 0</span>
        <span class="rune">12 → 4</span>
        <span class="rune">14 → 7</span>
        <span class="rune">15 → 9</span>
      </div>
    </footer>

  </div>

  <input id="class-payload" type="hidden" value="">
  <input id="page-state" type="hidden" value="">

  <div id="sheet-overlay" class="sheet-overlay">
    <div class="sheet-modal">
      <div class="sheet-modal-header">命运已定 · 确认角色</div>
      <div class="sheet-modal-body" id="sheet-body"></div>
      <div class="sheet-modal-footer">
        <button id="sheet-cancel" class="button button-tertiary" type="button">返回修改</button>
        <button id="sheet-commit" class="button" type="button">最终确认</button>
      </div>
    </div>
  </div>

<script src="class_creation.js"></script>
</body>
</html>
